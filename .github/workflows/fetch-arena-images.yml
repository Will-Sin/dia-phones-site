name: Fetch Are.na Images

on:
  schedule:
    # Run every night at 3am UTC
    - cron: '0 3 * * *'
  push:
    branches:
      - master
    paths:
      - '.github/workflows/fetch-arena-images.yml'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  fetch-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure ImageMagick is available
        run: |
          if ! command -v convert &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y imagemagick
          else
            echo "ImageMagick already installed"
          fi

      - name: Fetch and process Are.na images
        run: |
          CHANNEL_SLUG="dia-phone-slot-machine"
          OUTPUT_DIR="images/Icons"
          MAX_WIDTH=150  # 2x retina for 70px display

          mkdir -p "$OUTPUT_DIR"

          echo "Fetching channel contents from Are.na (v3 API)..."

          # Are.na API v3 paginates, fetch all pages
          PAGE=1
          PER=100
          ALL_URLS=""

          while true; do
            HTTP_CODE=$(curl -s -o /tmp/arena_response.json -w "%{http_code}" \
              "https://api.are.na/v3/channels/${CHANNEL_SLUG}/contents?page=${PAGE}&per=${PER}")

            if [ "$HTTP_CODE" -ne 200 ]; then
              echo "ERROR: Are.na API returned HTTP $HTTP_CODE on page $PAGE"
              cat /tmp/arena_response.json 2>/dev/null || true
              exit 1
            fi

            echo "Page $PAGE fetched (HTTP $HTTP_CODE)"

            # v3 API: items are in .data[], type is "Image", URL is .image.src
            URLS=$(jq -r '.data[]? | select(.type == "Image") | .image.src // empty' /tmp/arena_response.json)

            if [ -z "$URLS" ]; then
              echo "No image URLs found on page $PAGE, stopping pagination."
              break
            fi

            PAGE_COUNT=$(echo "$URLS" | wc -l)
            echo "  Found $PAGE_COUNT images on page $PAGE"
            ALL_URLS="${ALL_URLS}${URLS}"$'\n'

            # Check if there are more pages
            TOTAL=$(jq -r '.total_count // .length // 0' /tmp/arena_response.json)
            FETCHED=$((PAGE * PER))
            echo "  Fetched $FETCHED / $TOTAL total items"

            if [ "$FETCHED" -ge "$TOTAL" ]; then
              break
            fi

            PAGE=$((PAGE + 1))
          done

          rm -f /tmp/arena_response.json

          # Remove empty lines
          ALL_URLS=$(echo "$ALL_URLS" | sed '/^$/d')

          if [ -z "$ALL_URLS" ]; then
            echo "ERROR: No images found in channel."
            exit 1
          fi

          COUNT=$(echo "$ALL_URLS" | wc -l)
          echo "Found $COUNT total images across all pages"

          # Clear old images
          rm -f "$OUTPUT_DIR"/image*.jpg

          # Download and resize each image
          INDEX=1
          FAILED=0
          while IFS= read -r URL; do
            if [ -n "$URL" ]; then
              OUTFILE="$OUTPUT_DIR/image${INDEX}.jpg"
              echo "Downloading image ${INDEX}/${COUNT}..."
              if curl -sf "$URL" -o "${OUTFILE}.tmp"; then
                # Resize to max width, preserving aspect ratio, compress as JPEG
                convert "${OUTFILE}.tmp" \
                  -resize "${MAX_WIDTH}>" \
                  -quality 80 \
                  -strip \
                  "$OUTFILE"
                rm -f "${OUTFILE}.tmp"
                INDEX=$((INDEX + 1))
              else
                echo "  WARNING: Failed to download image $INDEX, skipping"
                rm -f "${OUTFILE}.tmp"
                FAILED=$((FAILED + 1))
              fi
            fi
          done <<< "$ALL_URLS"

          if [ "$FAILED" -gt 0 ]; then
            echo "WARNING: $FAILED images failed to download"
          fi

          # Write the count so script.js can pick it up
          FINAL_COUNT=$(ls "$OUTPUT_DIR"/image*.jpg 2>/dev/null | wc -l)
          echo "{\"count\": ${FINAL_COUNT}}" > "$OUTPUT_DIR/manifest.json"
          echo "Processed $FINAL_COUNT images successfully"

      - name: Check for changes
        id: changes
        run: |
          git add images/Icons/
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Update icons from Are.na channel"
          git pull --rebase origin master
          git push
