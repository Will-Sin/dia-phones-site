<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>Dashboard</h1>
    <div class="topbar-actions">
      <span id="next-checkin" class="muted"></span>
      <button id="checkin-now" class="ghost">Check in now</button>
      <button id="open-settings" class="ghost">Settings</button>
    </div>
  </header>

  <main class="layout">
    <section class="panel tasks-panel">
      <div class="panel-head">
        <h2>Tasks</h2>
        <div class="seg" role="tablist" aria-label="Group tasks by">
          <button data-group="project" class="active">By project</button>
          <button data-group="priority">By priority</button>
        </div>
      </div>

      <form id="add-task" class="add-task" autocomplete="off">
        <input id="task-title" placeholder="New task..." required>
        <select id="task-project" aria-label="Project"></select>
        <select id="task-priority" aria-label="Priority">
          <option value="1">High</option>
          <option value="2" selected>Medium</option>
          <option value="3">Low</option>
        </select>
        <button type="submit">Add</button>
      </form>

      <label class="show-done"><input type="checkbox" id="show-done"> Show completed</label>
      <div id="task-groups"></div>
    </section>

    <aside class="side">
      <section class="panel">
        <div class="panel-head"><h2>Projects</h2></div>
        <form id="add-project" class="add-project" autocomplete="off">
          <input id="project-name" placeholder="New project..." required>
          <button type="submit">Add</button>
        </form>
        <ul id="project-list" class="project-list"></ul>
      </section>

      <section class="panel">
        <div class="panel-head"><h2>Today</h2></div>
        <div id="today-stats" class="stats"></div>
      </section>

      <section class="panel">
        <div class="panel-head"><h2>Check-ins</h2></div>
        <ul id="checkin-log" class="checkin-log"></ul>
      </section>
    </aside>
  </main>

  <dialog id="start-dialog">
    <form method="dialog" class="dialog-body">
      <h3>How long do you want to spend?</h3>
      <p id="start-task-name" class="muted"></p>
      <div class="durations">
        <button type="button" data-min="15">15 min</button>
        <button type="button" data-min="25">25 min</button>
        <button type="button" data-min="40">40 min</button>
      </div>
      <div class="custom-row">
        <input id="custom-min" type="number" min="1" max="600" placeholder="Custom">
        <span class="muted">min</span>
        <button type="button" id="start-custom">Start</button>
      </div>
      <div class="dialog-foot"><button value="cancel" class="ghost">Cancel</button></div>
    </form>
  </dialog>

  <dialog id="settings-dialog">
    <form method="dialog" class="dialog-body">
      <h3>Settings</h3>
      <label class="row"><input type="checkbox" id="set-checkins"> Check-ins</label>
      <label class="row">Check in every <input type="number" id="set-interval" min="5" max="480" style="width:5em"> min</label>
      <label class="row"><input type="checkbox" id="set-sound"> Sounds</label>
      <div class="dialog-foot spread">
        <button type="button" id="export-data" class="ghost">Export JSON</button>
        <button value="close">Done</button>
      </div>
    </form>
  </dialog>

  <script src="shared.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
